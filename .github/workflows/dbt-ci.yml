
name: dbt CI

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - ".github/workflows/dbt-ci.yml"

jobs:
  push-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dbt

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

    permissions:
      contents: 'read'
      id-token: 'write'


    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "dbt/pyproject.toml"


      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9


      - name: Install python Packages
        run: |
          uv sync --frozen


      - name: Authenticate Google Acc
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}


      - name: 'Set up Google Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'


      - name: Install DBT packages
        run: |
          cd ecom_dbt_pj
          uv run dbt deps


      - name: Parse DBT project 
        run: |
          cd ecom_dbt_pj
          uv run dbt parse # check if there's jinja or yml errors


      - name: Compile DBT models  # generate SQLs
        run: |
          cd ecom_dbt_pj
          uv run dbt compile --target ci 


      - name: Build DBT models and run tests # run, test, snapshot, seed
        run: |
          cd ecom_dbt_pj
          uv run dbt build --target ci 


      - name: Delete ci dataset
        run: | 
          bq rm -r -f -d ${{ secrets.GCP_PROJECT }}:ci
