
name: dbt CI/CD

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - ".github/workflows/dbt-ci.yml"

  workflow_dispatch:

env:
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-east1

  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  GCP_JOB_NAME: ecom-pj
  GAR_REPO: ecom-pj
  GAR_IMAGE: dbt-pj
  GAR_TAG: ${{ github.sha }}


jobs:
  dbt-ci:
    name: dbt-run-and-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dbt

    permissions:
      contents: 'read'
      id-token: 'write'


    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "dbt/pyproject.toml"


      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9


      - name: Install python Packages
        run: |
          uv sync --frozen


      - name: Authenticate Google Acc
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}


      - name: 'Set up Google Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'


      - name: Install DBT packages
        run: |
          cd ecom_dbt_pj
          uv run dbt deps


      - name: Parse DBT project 
        run: |
          cd ecom_dbt_pj
          uv run dbt parse # check if there's jinja or yml errors


      - name: Compile DBT models  # generate SQLs
        run: |
          cd ecom_dbt_pj
          uv run dbt compile --target ci 


      - name: Build DBT models and run tests # run, test, snapshot, seed
        run: |
          cd ecom_dbt_pj
          uv run dbt build --target ci 


      - name: Delete ci dataset
        if: always()
        run: | 
          bq rm -r -f -d ${{ env.GCP_PROJECT_ID }}:ci


      - name: Generate dbt Docs
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          cd ecom_dbt_pj
          dbt docs generate


      - name: Setup Pages
        uses: actions/configure-pages@v5


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'ecom_dbt_pj/target' # dbt docs generate 會將產物放在 target/ 目錄


      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4




  dbt-cd:
    name: build-docker-image
    needs: dbt-ci # dbt-ci 成功後才會執行
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}


      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }} # Your service account key stored in GitHub Secrets


      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev


      - name: Build docker image
        run: |
          docker build --platform linux/amd64 -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.GAR_IMAGE }}:${{ env.GAR_TAG }} .
          docker build --platform linux/amd64 -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.GAR_IMAGE }}:latest .

      - name: Push docker image
        run: |
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.GAR_IMAGE }}:${{ env.GAR_TAG }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.GAR_IMAGE }}:latest


      - name: 'Set up Google Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

          
      - name: Deploy to Cloud Run Job
        run: |
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.GAR_IMAGE }}:${{ env.GAR_TAG }}
          if gcloud run jobs describe ${{ env.GCP_JOB_NAME }} --region ${{ env.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update ${{ env.GCP_JOB_NAME }} --region ${{ env.GCP_REGION }} --image $IMAGE
          else
            gcloud run jobs create ${{ env.GCP_JOB_NAME }} --region ${{ env.GCP_REGION }} --image $IMAGE
          fi
