
name: dbt CI/CD

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - ".github/workflows/dbt-ci.yml"

  workflow_dispatch:

env:
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-east1

  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  GCP_JOB_NAME: ecom-pj
  GAR_REPO: ecom-pj
  GAR_IMAGE: dbt-pj
  GAR_TAG: ${{ github.sha }}

  IMAGE_NAME: candychen00/ecom-pj
  TAG_NAME: test


jobs:
  dbt-ci:
    if: false # temporary skip
    name: dbt-run-and-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dbt

    permissions:
      contents: 'read'
      id-token: 'write'
      pages: 'write'


    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "dbt/pyproject.toml"


      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9


      - name: Install python Packages
        run: |
          uv sync --frozen


      - name: Authenticate Google Acc
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}


      - name: 'Set up Google Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'


      - name: Install DBT packages
        run: |
          cd ecom_dbt_pj
          uv run dbt deps


      - name: Parse DBT project 
        run: |
          cd ecom_dbt_pj
          uv run dbt parse # check if there's jinja or yml errors


      - name: Compile DBT models  # generate SQLs
        run: |
          cd ecom_dbt_pj
          uv run dbt compile --target ci 


      - name: Build DBT models and run tests # run, test, snapshot, seed
        run: |
          cd ecom_dbt_pj
          uv run dbt build --target ci 


      - name: Delete ci dataset
        if: always()
        run: | 
          bq rm -r -f -d ${{ env.GCP_PROJECT_ID }}:ci


      - name: Generate dbt Docs
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          cd ecom_dbt_pj
          uv run dbt docs generate


      - name: Setup Pages
        uses: actions/configure-pages@v5


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dbt/ecom_dbt_pj/target' # dbt docs generate 會將產物放在 target/ 目錄 (uses 步驟不受 working-directory 影響，需從 repo root 起算)


      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4




  dbt-cd:
    name: build-docker-image
    needs: dbt-ci # dbt-ci 成功後才會執行
    if: ${{ !cancelled() }}   # 即使 dbt-ci 被跳過，也照常執行 (temporary skip dbt-ci)
    runs-on: ubuntu-latest

    permissions:
        contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }} # Your service account key stored in GitHub Secrets


      # - name: Configure Docker for Artifact Registry
      #   run: gcloud auth configure-docker us-east1-docker.pkg.dev


      # - name: Delete all images in GAR repo
      #   run: |
      #     REPO_PATH=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}
      #     for IMG in $(gcloud artifacts docker images list $REPO_PATH --include-tags --format="value(package)" | sort -u); do
      #       gcloud artifacts docker images delete $IMG --delete-tags --quiet
      #     done


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}


      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max



      # - name: Build docker image
      #   run: |
      #     IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.GAR_IMAGE }}
      #     docker build --platform linux/amd64 -t $IMAGE:${{ env.GAR_TAG }} -t $IMAGE:latest .


      # - name: Push docker image
      #   run: |
      #     docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.GAR_IMAGE }}:${{ env.GAR_TAG }}
      #     docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.GAR_IMAGE }}:latest


      - name: 'Set up Google Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'


      - name: Update Cloud Run Job
        run: |
          gcloud run jobs update $GCP_JOB_NAME \
            --image=$IMAGE_NAME:${{ env.TAG_NAME }} \
            --region=$GCP_REGION \
            --project=$GCP_PROJECT_ID