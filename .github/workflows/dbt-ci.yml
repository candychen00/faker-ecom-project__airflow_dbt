
name: dbt CI/CD

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - ".github/workflows/dbt-ci.yml"

  workflow_dispatch:

env:
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-east1

  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  GCP_JOB_NAME: ecom-pj
  GAR_REPO: ecom-pj
  GAR_IMAGE: dbt-pj
  GAR_TAG: ${{ github.sha }}


jobs:
  dbt-ci:
    name: dbt-run-and-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dbt

    permissions:
      contents: 'read'
      id-token: 'write'


    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "dbt/pyproject.toml"


      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9


      - name: Install python Packages
        run: |
          uv sync --frozen


      - name: Authenticate Google Acc
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}


      - name: 'Set up Google Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'


      - name: Install DBT packages
        run: |
          cd ecom_dbt_pj
          uv run dbt deps


      - name: Parse DBT project 
        run: |
          cd ecom_dbt_pj
          uv run dbt parse # check if there's jinja or yml errors


      - name: Compile DBT models  # generate SQLs
        run: |
          cd ecom_dbt_pj
          uv run dbt compile --target ci 


      - name: Build DBT models and run tests # run, test, snapshot, seed
        run: |
          cd ecom_dbt_pj
          uv run dbt build --target ci 


      - name: Delete ci dataset
        if: always()
        run: | 
          bq rm -r -f -d ${{ env.GCP_PROJECT_ID }}:ci




  dbt-cd:
    name: build-docker-image
    needs: dbt-ci # dbt-ci 成功後才會執行
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}


      - name: Build docker image
        run: |
          docker build --platform linux/amd64 -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.GAR_IMAGE }}:${{ env.GAR_TAG }} .
          docker build --platform linux/amd64 -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.GAR_IMAGE }}:latest .

      - name: Push docker image
        run: |
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.GAR_IMAGE }}:${{ env.GAR_TAG }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.GAR_IMAGE }}:latest


      - name: Authenticate Google Acc
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}


      - name: 'Set up Google Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'


      - name: Deploy to Cloud Run Job
        run: |
          gcloud run jobs update ${{ env.GCP_JOB_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.GAR_IMAGE }}:${{ env.GAR_TAG }}
