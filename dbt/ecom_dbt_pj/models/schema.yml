
models:

  # ---------- src ----------

  - name: src_customers
    description: |
      - Staging view over the raw customers source
      - Adds `customer_sk`, a surrogate key hashed from customer_id, name, email, state and signup_date
      - All raw columns are passed through unchanged

  - name: src_products
    description: |
      - Staging view over the raw products source
      - Adds `product_sk`, a surrogate key hashed from fruit, category, product_id and price
      - All raw columns are passed through unchanged

  - name: src_orders
    description: |
      - Staging view over the raw orders source
      - Adds `order_sk`, a surrogate key hashed from order_id, order_at, customer_id, product_id, quantity and created_at
      - All raw columns are passed through unchanged

  # ---------- intermediate ----------

  - name: int_customers
    description: |
      - Deduplicated customers, one row per `customer_sk`
      - Built from src_customers
      - Removes exact duplicate records (same values in all surrogate key columns)

  - name: int_products
    description: |
      - Deduplicated products, one row per `product_sk`
      - Built from src_products
      - Removes exact duplicate records (same values in all surrogate key columns)

  - name: int_orders
    description: |
      - Deduplicated orders, one row per `order_sk`
      - Built from src_orders
      - Removes exact duplicate records (same values in all surrogate key columns)

  # ---------- dim ----------

  - name: dim_products
    description: |
      - Product dimension, one row per product
      - Built from int_products
      - `product` is the fruit and category joined with a space (e.g. "Apple Juice")
    config:
      contract:
        enforced: true
    columns:

      - name: product_sk
        data_type: string(50)
        data_tests:
          - not_null
          - unique

      - name: product_id
        data_type: integer
        data_tests:
          - not_null
          - unique
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 39

      - name: product
        data_type: string(50)
        data_tests:
          - not_null
          - unique
          - concat_two_strings:
              arguments:
                col_a: prod_fruit
                col_b: prod_category
                seperator: " "

      - name: prod_category
        data_type: string(30)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Juice', 'Jam', 'Dried Snacks', 'Smoothie', 'Gummies']

      - name: prod_fruit
        data_type: string(30)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Apple', 'Banana', 'Orange', 'Strawberry', 'Mango', 'Blueberry', 'Peach', 'Pineapple']

      - name: unit_price
        data_type: numeric(5,2) # decimal
        data_tests:
          - not_null

      - name: updated_at
        data_type: datetime
        data_tests:
          - not_null 

      - name: created_at
        data_type: datetime
        data_tests:
          - not_null 



  - name: dim_customers
    description: |
      - Customer dimension, one row per customer
      - Built from int_customers
      - `first_name` and `last_name` are split from the full name
    config:
      contract:
        enforced: true
    columns:

      - name: customer_sk
        data_type: string(50)
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_type: string(50)
        data_tests:
          - unique
          - not_null

      - name: first_name
        data_type: string(30)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              name: customer_first_name_start_with_capital
              arguments:
                regex: "^[A-Z][a-z]+$"

      - name: last_name
        data_type: string(30)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              name: customer_last_name_start_with_capital
              arguments: 
                regex: "^[A-Z][a-z]+$"

      - name: full_name
        data_type: string(50)
        data_tests:
          - not_null
          - concat_two_strings:
              arguments:
                col_a: first_name
                col_b: last_name
                seperator: " "

      - name: state
        data_type: string(50)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              name: customer_state_start_with_capital
              arguments: 
                regex: '^[A-Z][a-z]+(?: [A-Z][a-z]+)*$'

      - name: email
        data_type: string(50)
        data_tests:
          - not_null
      
      - name: signup_date
        data_type: date
        data_tests:
          - not_null

      - name: updated_at
        data_type: datetime
        data_tests:
          - not_null 

      - name: created_at
        data_type: datetime
        data_tests:
          - not_null 



  # ---------- fct ----------

  - name: fct_orders
    description: |
      - Order fact table, one row per order
      - Built from int_orders, joined to dim_products
      - `order_amt` = quantity * unit_price
      - Incremental: merges on order_id and reprocesses rows updated within 3 hours of the latest loaded updated_at
    config:
      contract:
        enforced: true
    columns:

      - name: order_sk
        data_type: string(50)
        data_tests:
          - not_null
          - unique   

      - name: order_id
        data_type: string(50)
        data_tests:
          - not_null
          - unique
      
      - name: order_at
        data_type: datetime
        data_tests:
          - not_null

      - name: product_id
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: customer_id
        data_type: string(50)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: ord_quantity
        data_type: integer
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true # > 0, not equals to zero
          
      - name: order_amt
        data_type: numeric(8,2)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              name: order_amt_greater_than_zero
              arguments:
                min_value: 0
                strictly: true # > 0, not equals to zero

      - name: updated_at
        data_type: datetime
        data_tests:
          - not_null  

      - name: created_at
        data_type: datetime
        data_tests:
          - not_null  


  # ---------- mart ----------

  - name: mart_daily_by_prod
    description: |
      - Daily sales by product, one row per order_date × product
      - Built from fct_orders joined to dim_products
      - Sums ord_quantity and order_amt (rounded to 2 decimals)

  - name: mart_daily_by_cat
    description: |
      - Daily sales by product category, one row per order_date × prod_category
      - Rolled up from mart_daily_by_prod via the `daily_agg` macro

  - name: mart_daily_by_fruit
    description: |
      - Daily sales by fruit, one row per order_date × prod_fruit
      - Rolled up from mart_daily_by_prod via the `daily_agg` macro

  - name: mart_monthly_by_prod
    description: |
      - Monthly sales by product, one row per year_month (YYYY-MM) × product
      - Built from fct_orders joined to dim_products
      - Sums ord_quantity and order_amt (rounded to 2 decimals)

  - name: mart_monthly_by_cat
    description: |
      - Monthly sales by product category, one row per year_month × prod_category
      - Rolled up from mart_monthly_by_prod via the `monthly_agg` macro

  - name: mart_monthly_by_fruit
    description: |
      - Monthly sales by fruit, one row per year_month × prod_fruit
      - Rolled up from mart_monthly_by_prod via the `monthly_agg` macro


  # ---------- data quality ----------

  - name: dq_dup_count
    description: |
      - Duplicate-key summary across the raw, intermediate and dim/fct layers
      - One row per table: dup_count = row count − distinct business key count
      - Checks orders (order_id), products (product_id) and customers (customer_id)
      - run_time timezone: Asia/Taipei

  - name: dq_dup_details
    description: |
      - Lists each business key that appears more than once in the raw source tables
      - One row per duplicated id, with how many times it appears (record_count)
      - Covers raw_orders, raw_customers and raw_products
      - run_time timezone: Asia/Taipei
