ecom_dbt_pj:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      keyfile: "{{ env_var('GCP_SECRET_PATH') }}"
      dataset: dev
      location: us-east1
      threads: 1
      timeout_seconds: 300
      priority: interactive